<text x="527.0" y="684.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">补上压缩那次的 token</text>
<rect x="638" y="606" width="190" height="92" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="733.0" y="629.9" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">Action Fusion</text>
<text x="733.0" y="648.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">fusion.js</text>
<text x="733.0" y="666.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">改完就测，一次调用</text>
<text x="733.0" y="684.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">命令优先走 ops_bash</text>
<rect x="844" y="606" width="190" height="92" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.6"/>
<text x="939.0" y="629.9" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">ObservationPack</text>
