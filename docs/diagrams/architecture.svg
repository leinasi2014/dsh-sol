<text x="939.0" y="666.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">大输出换成句柄</text>
<text x="939.0" y="684.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">用 obs_recall 按页回读</text>
<rect x="1050" y="606" width="170" height="92" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6" stroke-dasharray="6 4"/>
