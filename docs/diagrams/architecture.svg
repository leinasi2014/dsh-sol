<text x="600.0" y="135.3" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">profile 里配置的 provider</text>
<rect x="760" y="92" width="240" height="58" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="880.0" y="116.9" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">便宜模型（只给 Reducer 用）</text>
<text x="880.0" y="135.3" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">可选，默认不调用</text>
<rect x="60" y="220" width="200" height="80" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/>
