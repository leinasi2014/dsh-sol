<text x="116.0" y="682.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">读配置开关</text>
<text x="116.0" y="700.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">只装配打开的</text>
