<text x="160.0" y="257.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">原生，只在压缩时运行</text>
<text x="160.0" y="274.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">超过 8192 字符的结果</text>
<text x="160.0" y="290.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">只留头 4096、尾 1024</text>
<rect x="500" y="220" width="200" height="80" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/>
<text x="600.0" y="246.9" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">LLM 层</text>
<text x="600.0" y="265.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">llm/stream</text>
<text x="600.0" y="283.3" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">每次 provider 请求都经过</text>
<rect x="720" y="220" width="240" height="80" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/>
<text x="840.0" y="246.9" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">内置工具</text>
<text x="840.0" y="265.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">edit / write / pwsh</text>
<text x="840.0" y="283.3" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">命令走沙箱和审批</text>
<rect x="980" y="220" width="240" height="80" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/>
<text x="1100.0" y="246.9" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">spill-policy（原生落盘）</text>
<text x="1100.0" y="265.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">超过 12500 token 落盘</text>
<text x="1100.0" y="283.3" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">只给头尾预览和路径</text>
