<text x="1135.0" y="666.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">日志压成回执</text>
<text x="1135.0" y="684.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">引文逐字核对</text>
<rect x="226" y="736" width="396" height="90" rx="8" fill="#fafafa" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="424.0" y="767.9" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">OCC 的状态</text>
<text x="424.0" y="786.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">按 sessionId 存进插件自己的存储域</text>
<text x="424.0" y="804.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">不写会话日志（外部插件不允许写）</text>
<rect x="638" y="736" width="582" height="90" rx="8" fill="#fefce8" stroke="#a16207" stroke-width="1.6"/>
<text x="929.0" y="767.9" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">archive.js + ledger.jsonl（共用）</text>
<text x="929.0" y="786.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">内容寻址存档：按 sha256 命名，写一次不再改；只存模型看到的那份</text>
<text x="929.0" y="804.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">账本记每回合 token、每次替换、回读、融合、回退和前后字节数</text>
<rect x="226" y="880" width="396" height="64" rx="8" fill="#fafafa" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="424.0" y="907.9" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">不碰的东西</text>
<text x="424.0" y="926.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">不写会话目录，不调 appendPluginRecord，不改 DSH 配置</text>
<rect x="638" y="880" width="582" height="64" rx="8" fill="#fafafa" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="929.0" y="907.9" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">本地磁盘：$DSH_HOME/dsh-sol/&lt;sessionId&gt;/</text>
<text x="929.0" y="926.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">objects/&lt;sha256&gt;.txt  ·  ledger.jsonl  ·  权限靠用户目录 ACL</text>
