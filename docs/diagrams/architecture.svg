<text x="40.0" y="68.0" font-size="13" font-weight="normal" fill="#6b7280" text-anchor="start">灰色是 DSH 原生能力，彩色是 dsh-sol 插件模块，虚线框表示可选或默认关闭。箭头上写的是挂接点。</text>
<rect x="500" y="92" width="200" height="58" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/>
