<text x="160.0" y="420.1" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">压缩服务</text>
<text x="160.0" y="437.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">ctx.compaction</text>
<text x="160.0" y="454.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">原生自动压：本机主力</text>
<text x="160.0" y="470.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">模型约 55% 窗口时</text>
