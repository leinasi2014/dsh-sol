<text x="370.0" y="454.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">每步开头 agent/pre-step</text>
<rect x="480" y="400" width="220" height="80" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/>
<text x="590.0" y="428.4" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">会话日志 + 原生计量</text>
<text x="590.0" y="445.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">session/event 逐条提交</text>
<text x="590.0" y="462.3" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">tokenUsage 投影已记主循环</text>
<rect x="720" y="400" width="500" height="80" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/>
<text x="970.0" y="435.9" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">工具调用流水线</text>
<text x="970.0" y="454.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">pre-execute → guard → execute → post-execute → finalizeContent → result</text>
