<path d="M 510.0 230.0 L 580.0 230.0" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ah2563eb)"/>
<path d="M 510.0 308.0 L 580.0 308.0" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ah2563eb)"/>
<path d="M 510.0 386.0 L 580.0 386.0" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#ah7c3aed)"/>
<path d="M 510.0 464.0 L 580.0 464.0" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#ah059669)"/>
<path d="M 510.0 542.0 L 580.0 542.0" fill="none" stroke="#0d9488" stroke-width="1.5" marker-end="url(#ah0d9488)"/>
<path d="M 510.0 620.0 L 580.0 620.0" fill="none" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#ah8b5cf6)"/>
</svg>
