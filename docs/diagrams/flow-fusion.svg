<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="1190" viewBox="0 0 1110 1190">
<style>text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Segoe UI',sans-serif;}</style>
<defs>
<marker id="ah2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
<marker id="ahdc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="40.0" y="42.0" font-size="22" font-weight="bold" fill="#111827" text-anchor="start">Action Fusion：改完就测，省掉一轮请求</text>
<text x="40.0" y="68.0" font-size="13" font-weight="normal" fill="#6b7280" text-anchor="start">编辑或写文件之后，校验命令在同一次工具调用里跑完。</text>
<rect x="40" y="90" width="490" height="116" rx="8" fill="#fafafa" stroke="#9ca3af" stroke-width="1.6"/>
<text x="52.0" y="125.9" font-size="14" font-weight="bold" fill="#111827" text-anchor="start">原来：改和测分两次调用</text>
<text x="52.0" y="144.3" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">请求 1：模型调 edit，改完的结果回到模型</text>
<text x="52.0" y="162.3" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">请求 2：模型调 pwsh 跑测试，测试结果回到模型</text>
<text x="52.0" y="180.3" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">请求 3：模型看测试结果，决定下一步</text>
<rect x="580" y="90" width="490" height="116" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="592.0" y="125.9" font-size="14" font-weight="bold" fill="#111827" text-anchor="start">现在：一次调用</text>
<text x="592.0" y="144.3" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">请求 1：模型调 edit_then_run，改完立刻跑测试</text>
<text x="592.0" y="162.3" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">两份结果一起回到模型</text>
<text x="592.0" y="180.3" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">请求 2：模型看结果，决定下一步。少了一轮请求</text>
<rect x="170" y="240" width="420" height="60" rx="30.0" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/>
<text x="380.0" y="265.9" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">模型调 edit_then_run</text>
<text x="380.0" y="284.3" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">edit 的参数，加 then_run { command, timeout(ms) }（必填）</text>
<rect x="170" y="330" width="420" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="380.0" y="353.9" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">嵌套调用内置 edit 改文件</text>
<text x="380.0" y="372.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">ctx.tools.execute，带 parent；照常走审批和超时</text>
<polygon points="190.0,416.0 570.0,416.0 590.0,444.0 570.0,472.0 190.0,472.0 170.0,444.0" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="380.0" y="448.9" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">改成功了吗？</text>
<rect x="660" y="416" width="410" height="56" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="865.0" y="439.9" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">整个调用报错，用 edit 的原错误</text>
<text x="865.0" y="458.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">没改成，命令一次都不跑；不返回“成功 + 标记”</text>
<rect x="170" y="502" width="420" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="380.0" y="525.9" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">重读一次文件，和 edit 返回的 after 对比</text>
<text x="380.0" y="544.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">读不到就不拦，照常跑命令</text>
<polygon points="190.0,588.0 570.0,588.0 590.0,616.0 570.0,644.0 190.0,644.0 170.0,616.0" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="380.0" y="620.9" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">文件被别处改过吗？</text>
<rect x="660" y="588" width="410" height="56" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="865.0" y="611.9" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">返回改完的结果 + [then_run:skipped]</text>
<text x="865.0" y="630.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">不在被别人改过的文件上跑命令</text>
<rect x="170" y="670" width="420" height="64" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="380.0" y="688.9" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">嵌套调用 shell 跑 then_run 命令</text>
<text x="380.0" y="707.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">按 shells 配置挑第一个已注册、返回值读得懂的（默认先 ops_bash）</text>
<text x="380.0" y="725.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">返回字符串的 persistent 版跳过；description 由插件合成</text>
<polygon points="190.0,760.0 570.0,760.0 590.0,788.0 570.0,816.0 190.0,816.0 170.0,788.0" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="380.0" y="783.9" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">命令真的跑了吗？</text>
<text x="380.0" y="802.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">没有 isError，也没有 value.error（ops_bash 起不来时有）</text>
<rect x="660" y="754" width="410" height="68" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="865.0" y="776.4" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">返回改完的结果 + [then_run:not_run] + 原因</text>
<text x="865.0" y="793.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">用户拒绝、策略拦下、没有可用 shell、shell 起不来、取消</text>
<text x="865.0" y="810.2" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">原因原文照抄；文件改动保留，不重试</text>
<polygon points="190.0,846.0 570.0,846.0 590.0,874.0 570.0,902.0 190.0,902.0 170.0,874.0" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="380.0" y="869.9" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">没超时、没被信号杀掉，且退出码就是 0？</text>
<text x="380.0" y="888.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">成功必须由退出码 0 证明；缺退出码、null 都不算</text>
<rect x="660" y="840" width="410" height="68" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="865.0" y="862.4" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">返回改完的结果 + [then_run:failed] + 错误输出</text>
<text x="865.0" y="879.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">退出码非 0、缺退出码、被信号杀掉或超时；文件改动保留</text>
<text x="865.0" y="896.2" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">pwsh 超时可能转后台：带上 jobId，写明还在跑</text>
<rect x="170" y="932" width="420" height="56" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
<text x="380.0" y="955.9" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">返回改完的结果 + [then_run:succeeded] + 命令输出</text>
<text x="380.0" y="974.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">输出原样拼进去；被截断时带上全文路径</text>
<rect x="200" y="1120" width="360" height="44" rx="22.0" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/>
<text x="380.0" y="1146.9" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">所有出口：合并结果进 post-execute，结束</text>
<rect x="660" y="932" width="410" height="176" rx="8" fill="#fafafa" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="672.0" y="958.9" font-size="14" font-weight="bold" fill="#111827" text-anchor="start">说明</text>
<text x="672.0" y="976.2" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">then_run 必填；不想跑命令就用普通 edit。</text>
<text x="672.0" y="992.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">只有外层合并结果进后处理和会话日志，照常会被 spill 截断。</text>
<text x="672.0" y="1009.2" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">工具默认独占调度，同一步里不和别的调用并发，所以不加文件锁。</text>
<text x="672.0" y="1025.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">not_run 是 DSH 版新增的，SoL-Pi 原版没有审批。</text>
<text x="672.0" y="1042.2" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">只在 native preset 下有用；PTC 里 run_code 本来就能连着调。</text>
<text x="672.0" y="1058.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">v1 只包 edit / write，不包 dsh-ops 的 ops_replace。</text>
<text x="672.0" y="1075.2" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">推断不会多弹审批：嵌套调用不带 sandbox_permissions。</text>
<text x="672.0" y="1091.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">论文估计：模型轮次 −10.8%，token −11.5%，不是我们测的。</text>
