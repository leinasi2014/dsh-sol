<text x="555.0" y="232.0" font-size="11" fill="#4b5563" text-anchor="middle">否</text>
<rect x="544.5" y="309.0" width="21.0" height="18" rx="4" fill="#ffffff" fill-opacity="0.95"/>
<text x="555.0" y="322.0" font-size="11" fill="#4b5563" text-anchor="middle">否</text>
<rect x="531.0" y="467.0" width="98.0" height="18" rx="4" fill="#ffffff" fill-opacity="0.95"/>
