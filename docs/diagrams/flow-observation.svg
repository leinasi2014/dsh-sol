<text x="900.0" y="547.0" font-size="11" fill="#0d9488" text-anchor="middle">是</text>
<rect x="673.0" y="264.0" width="54.0" height="18" rx="4" fill="#ffffff" fill-opacity="0.95"/>
<text x="700.0" y="277.0" font-size="11" fill="#0d9488" text-anchor="middle">否，再调</text>
