<path d="M 380.0 836.0 L 380.0 866.0" fill="none" stroke="#ea580c" stroke-width="1.5" marker-end="url(#ahea580c)"/>
<path d="M 380.0 922.0 L 380.0 952.0" fill="none" stroke="#ea580c" stroke-width="1.5" marker-end="url(#ahea580c)"/>
