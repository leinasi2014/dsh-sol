<path d="M 360.0 364.0 L 360.0 410.0" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah4b5563)"/>
<path d="M 190.0 440.0 L 150.0 440.0" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah4b5563)"/>
<path d="M 360.0 470.0 L 360.0 510.0" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah4b5563)"/>
<path d="M 530.0 542.0 L 620.0 542.0" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 4"/>
<path d="M 360.0 574.0 L 360.0 640.0" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah4b5563)"/>
<path d="M 530.0 672.0 L 575.0 672.0" fill="none" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="6 4"/>
<path d="M 575.0 623.0 L 575.0 735.0" fill="none" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="6 4"/>
<path d="M 575.0 623.0 L 620.0 623.0" fill="none" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="6 4"/>
<path d="M 575.0 679.0 L 620.0 679.0" fill="none" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="6 4"/>
<path d="M 575.0 735.0 L 620.0 735.0" fill="none" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="6 4"/>
<path d="M 360.0 704.0 L 360.0 820.0" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah4b5563)"/>
<path d="M 360.0 876.0 L 360.0 916.0" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah4b5563)"/>
<rect x="564.5" y="203.0" width="21.0" height="18" rx="4" fill="#ffffff" fill-opacity="0.95"/>
<text x="575.0" y="216.0" font-size="11" fill="#7c3aed" text-anchor="middle">是</text>
<rect x="349.5" y="255.0" width="21.0" height="18" rx="4" fill="#ffffff" fill-opacity="0.95"/>
<text x="360.0" y="268.0" font-size="11" fill="#4b5563" text-anchor="middle">否</text>
<rect x="159.5" y="419.0" width="21.0" height="18" rx="4" fill="#ffffff" fill-opacity="0.95"/>
<text x="170.0" y="432.0" font-size="11" fill="#4b5563" text-anchor="middle">否</text>
<rect x="349.5" y="481.0" width="21.0" height="18" rx="4" fill="#ffffff" fill-opacity="0.95"/>
<text x="360.0" y="494.0" font-size="11" fill="#4b5563" text-anchor="middle">是</text>
